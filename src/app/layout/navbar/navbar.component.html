@if (portfolioData$ | async; as data) {
  <header class="navbar dark" [class.scrolled]="isScrolled()" id="navbar">
    <a href="#hero" class="nav-logo" appTilt [tiltAmount]="16" [scale]="1.05" aria-label="Diego Monroy">
        <img src="assets/logo-dm-pro.svg" alt="Diego Monroy" class="logo" />
    </a>

    <nav class="nav-menu">
        <a class="nav-item" [class.active]="activeSection() === 'hero'" href="#hero">{{ data.nav.home }}</a>
        <a class="nav-item" [class.active]="activeSection() === 'proyectos'" href="#proyectos">{{ data.nav.projects }}</a>
        <a class="nav-item" [class.active]="activeSection() === 'sobre'" href="#sobre">{{ data.nav.about }}</a>
        <a class="nav-item" [class.active]="activeSection() === 'proceso'" href="#proceso">{{ data.nav.how }}</a>
    </nav>

    <div class="nav-actions">
        <button type="button" 
                class="nav-qr-btn" 
                (click)="openQrModal('portfolio')" 
                title="Compartir o Escanear QR" 
                aria-label="Compartir o Escanear código QR">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
            <span class="nav-qr-text">QR</span>
        </button>

        <app-language-switcher></app-language-switcher>
        <a href="#contacto" class="btn btn-primary">{{ data.nav.contact }}</a>
    </div>

    <div class="nav-mobile-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation">
      @if (!mobileMenuActive()) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18" />
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      }
    </div>
  </header>

  <!-- MENU MOBILE OVERLAY -->
  <div class="mobile-menu" [class.active]="mobileMenuActive()" id="mobileMenu">
    <nav>
        <a href="#hero" class="mobile-link" (click)="closeMobileMenu()">{{ data.nav.home }}</a>
        <a href="#proyectos" class="mobile-link" (click)="closeMobileMenu()">{{ data.nav.projects }}</a>
        <a href="#sobre" class="mobile-link" (click)="closeMobileMenu()">{{ data.nav.about }}</a>
        <a href="#proceso" class="mobile-link" (click)="closeMobileMenu()">{{ data.nav.how }}</a>
        <a href="#contacto" class="mobile-link" (click)="closeMobileMenu()" style="color: var(--apple-blue);">{{ data.nav.contact }}</a>
        <button type="button" class="mobile-link qr-mobile-btn" (click)="openQrModal('portfolio'); closeMobileMenu()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
            <span>Escanear / Compartir QR</span>
        </button>
    </nav>
  </div>
}
