<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple Pro Matte Obsidian & Titanium Frame -->
  <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="9" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  
  <!-- Diffused Sapphire Ambient Glow -->
  <circle cx="28" cy="9" r="10" fill="#0071E3" opacity="0.3" filter="url(#sapphireBlur)"/>

  <!-- High-Precision Vector Monogram DM -->
  <g fill="url(#textGrad)">
    <!-- Letter D: Bold Architectural Sans -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M7.5 10.5H13.6C17.2 10.5 19.5 12.6 19.5 16C19.5 19.4 17.2 21.5 13.6 21.5H7.5V10.5ZM10.4 12.9V19.1H13.3C15.4 19.1 16.6 17.9 16.6 16C16.6 14.1 15.4 12.9 13.3 12.9H10.4Z"/>
    
    <!-- Letter M: Heavy Geometric Sans -->
    <path d="M19.2 21.5V10.5H21.7L23.9 16.7L26.1 10.5H28.5V21.5H25.9V14.3L24.3 18.8H23.4L21.8 14.3V21.5H19.2Z"/>
  </g>

  <!-- Apple Sapphire Status Accent -->
  <circle cx="28.5" cy="8.5" r="2" fill="#2997FF"/>
  <circle cx="28.5" cy="8.5" r="3.5" stroke="#2997FF" stroke-opacity="0.4" stroke-width="0.8"/>

  <defs>
    <!-- Sapphire Blur Filter -->
    <filter id="sapphireBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- Dark Titanium Obsidian Background -->
    <linearGradient id="bgGrad" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181824"/>
      <stop offset="0.6" stop-color="#0E0E16"/>
      <stop offset="1" stop-color="#08080D"/>
    </linearGradient>
    
    <!-- Apple Laser-Cut Hairline Border -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255, 255, 255, 0.35)"/>
      <stop offset="0.4" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="0.8" stop-color="rgba(41, 151, 255, 0.25)"/>
      <stop offset="1" stop-color="rgba(0, 113, 227, 0.6)"/>
    </linearGradient>

    <!-- Titanium Silver to White Letterforms -->
    <linearGradient id="textGrad" x1="8" y1="10" x2="28" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#E2E4EC"/>
      <stop offset="1" stop-color="#2997FF"/>
    </linearGradient>
  </defs>
</svg>
